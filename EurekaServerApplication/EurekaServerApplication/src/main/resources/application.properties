# ===========================================
# EUREKA SERVER CONFIGURATION
# ===========================================

# Application Name
spring.application.name=eureka-server

# Server Port
server.port=8761
server.servlet.context-path=/

# ===========================================
# EUREKA SERVER PROPERTIES
# ===========================================

# Enable Eureka Server
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=30000
eureka.server.response-cache-auto-expiration-in-seconds=180

# Eureka Instance Configuration (for Eureka Server itself)
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Do NOT register Eureka Server with itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# ===========================================
# LOGGING CONFIGURATION
# ===========================================

# Logging Level
logging.level.root=INFO
logging.level.com.blog=DEBUG
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN

# Logging File
logging.file.name=logs/eureka-server.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===========================================
# ACTUATOR CONFIGURATION
# ===========================================

# Enable Health Check
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Endpoint Base Path
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health

# ===========================================
# COMPRESSION CONFIGURATION
# ===========================================

# Enable Compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.excluded-mime-types=image/png,image/jpeg,image/gif
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ===========================================
# CONNECTION POOL CONFIGURATION
# ===========================================

# Tomcat Thread Pool
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50
server.tomcat.max-connections=10000

# ===========================================
# ENVIRONMENT VARIABLES (Can be overridden)
# ===========================================

# JWT Secret (can be set via environment variable)
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtAuthentication123456}

# Database (if needed for extended Eureka features)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eureka_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# SECURITY CONFIGURATION
# ===========================================

# Enable CORS by default
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600